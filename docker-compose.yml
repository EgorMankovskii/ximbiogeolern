services:
  web:
    build: .
    command: gunicorn pyteacher.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: change_me_to_a_long_random_secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: example.com,www.example.com,127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com,https://www.example.com
      POSTGRES_DB: eduquest
      POSTGRES_USER: eduquest
      POSTGRES_PASSWORD: eduquest
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eduquest
      POSTGRES_USER: eduquest
      POSTGRES_PASSWORD: eduquest
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
